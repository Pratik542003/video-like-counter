spring:
  application:
    name: video-like-counter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/likecounter}
    username: ${DB_USERNAME:likecounter}
    password: ${DB_PASSWORD:likecounter}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.example.likecounter: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name:-app}] [%t] [requestId=%X{requestId:-none}] %logger{40} - %m%n%wEx"
